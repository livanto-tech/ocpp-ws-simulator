services:
  ocpp-simulator:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_ALLOW_AUTH: "${NEXT_PUBLIC_ALLOW_AUTH:-true}"
    container_name: ocpp-ws-simulator
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:3000"
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - ALLOW_AUTH=${ALLOW_AUTH:-true}
      - MASTER_USERNAME=${MASTER_USERNAME:-TESTING@2001}
      - MASTER_PASSWORD=${MASTER_PASSWORD:-TESTING}
